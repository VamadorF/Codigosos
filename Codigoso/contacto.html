<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeBears - Contacto</title>
    <link rel="icon" href="image/oso2.jpg" type="image/jpeg">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>

<div id="root"></div>

<script type="text/babel">

    const { useState } = React;

    function Header({ siteName }) {
        return (
            <header>
                <h1>{siteName}</h1>
                <p style={{ margin: "4px 0 0", fontSize: "14px", color: "#d4edda" }}>
                    Desarrollo web con garras — Sin hibernar desde 2015
                </p>
            </header>
        );
    }

    function Nav() {
        return (
            <nav>
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="servicios.html">Servicios</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                    <li><a href="https://www.w3schools.com" target="_blank">Recursos</a></li>
                </ul>
            </nav>
        );
    }

    function CampoInput({ label, tipo, id, value, onChange, placeholder, error }) {
        return (
            <div>
                <label htmlFor={id}>{label}:</label>
                <input
                    type={tipo}
                    id={id}
                    value={value}
                    onChange={onChange}
                    placeholder={placeholder}
                />
                {error && <p style={{ color: "red", fontSize: "13px", margin: "2px 0 0" }}>{error}</p>}
            </div>
        );
    }

    function ContactForm() {
        const [campos, setCampos] = useState({
            nombre: "",
            email: "",
            telefono: "",
            empresa: "",
            asunto: "",
            mensaje: ""
        });

        const [errores, setErrores] = useState({});
        const [enviado, setEnviado] = useState(false);

        function handleChange(e) {
            setCampos({ ...campos, [e.target.id]: e.target.value });
        }

        function validar() {
            const nuevosErrores = {};
            const formatoEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (campos.nombre.trim() === "") {
                nuevosErrores.nombre = "El nombre es obligatorio.";
            }
            if (campos.email.trim() === "") {
                nuevosErrores.email = "El correo es obligatorio.";
            } else if (!formatoEmail.test(campos.email)) {
                nuevosErrores.email = "El correo no tiene un formato válido.";
            }
            if (campos.asunto === "") {
                nuevosErrores.asunto = "Debes seleccionar un asunto.";
            }
            if (campos.mensaje.trim() === "") {
                nuevosErrores.mensaje = "El mensaje no puede estar vacío.";
            } else if (campos.mensaje.trim().length < 10) {
                nuevosErrores.mensaje = "El mensaje debe tener al menos 10 caracteres.";
            }

            return nuevosErrores;
        }

        function handleSubmit(e) {
            e.preventDefault();
            const nuevosErrores = validar();
            setErrores(nuevosErrores);

            if (Object.keys(nuevosErrores).length === 0) {
                setEnviado(true);
            }
        }

        if (enviado) {
            return (
                <div className="exito-envio">
                    <p><strong>¡Mensaje recibido en la guarida!</strong></p>
                    <p>Hola <strong>{campos.nombre}</strong>, te responderemos al correo <strong>{campos.email}</strong> dentro de 24 horas hábiles. Ningún oso hiberna cuando hay clientes esperando.</p>
                    <button
                        className="btn-oso"
                        onClick={() => { setEnviado(false); setCampos({ nombre: "", email: "", telefono: "", empresa: "", asunto: "", mensaje: "" }); setErrores({}); }}
                        style={{ backgroundColor: "#3d6b40", color: "white", border: "none", padding: "7px 16px", cursor: "pointer", marginTop: "10px" }}
                    >
                        Enviar otro mensaje
                    </button>
                </div>
            );
        }

        return (
            <form onSubmit={handleSubmit} noValidate>
                <fieldset>
                    <legend>Datos personales</legend>
                    <CampoInput
                        label="Nombre"
                        tipo="text"
                        id="nombre"
                        value={campos.nombre}
                        onChange={handleChange}
                        placeholder="Tu nombre completo"
                        error={errores.nombre}
                    />
                    <CampoInput
                        label="Correo electrónico"
                        tipo="email"
                        id="email"
                        value={campos.email}
                        onChange={handleChange}
                        placeholder="correo@ejemplo.com"
                        error={errores.email}
                    />
                    <CampoInput
                        label="Teléfono"
                        tipo="tel"
                        id="telefono"
                        value={campos.telefono}
                        onChange={handleChange}
                        placeholder="+56 9 1234 5678"
                        error={null}
                    />
                    <CampoInput
                        label="Empresa"
                        tipo="text"
                        id="empresa"
                        value={campos.empresa}
                        onChange={handleChange}
                        placeholder="Nombre de tu empresa"
                        error={null}
                    />
                </fieldset>

                <fieldset>
                    <legend>Consulta</legend>

                    <label htmlFor="asunto">Asunto:</label>
                    <select id="asunto" value={campos.asunto} onChange={handleChange}>
                        <option value="">Selecciona una opción</option>
                        <option value="diseño">Diseño web</option>
                        <option value="apps">Desarrollo de aplicaciones</option>
                        <option value="consultoria">Consultoría</option>
                        <option value="soporte">Soporte técnico</option>
                        <option value="otro">Otro</option>
                    </select>
                    {errores.asunto && <p style={{ color: "red", fontSize: "13px", margin: "2px 0 0" }}>{errores.asunto}</p>}

                    <label htmlFor="mensaje">Mensaje:</label>
                    <textarea
                        id="mensaje"
                        rows="5"
                        value={campos.mensaje}
                        onChange={handleChange}
                        placeholder="Cuéntanos sobre tu proyecto. No te pongas en cuatro patas, escribe directo."
                    />
                    {errores.mensaje && <p style={{ color: "red", fontSize: "13px", margin: "2px 0 0" }}>{errores.mensaje}</p>}
                    <small>Caracteres: {campos.mensaje.length}</small>
                </fieldset>

                <input type="submit" value="Enviar" />
            </form>
        );
    }

    function App() {
        return (
            <div>
                <Header siteName="CodeBears" />
                <Nav />
                <main>
                    <section>
                        <h2>Contacto</h2>
                        <p>¿Tienes un proyecto en mente? Cuéntanos. Nuestro equipo tiene las garras listas y nunca duerme en invierno. Te respondemos dentro de 24 horas hábiles.</p>
                        <ContactForm />
                    </section>

                    <section>
                        <h2>Información de contacto</h2>
                        <ul>
                            <li><strong>Guarida central:</strong> Av. Providencia 1234, Of. 502, Santiago</li>
                            <li><strong>Teléfono:</strong> +56 2 2345 6789</li>
                            <li><strong>Correo:</strong> <a href="mailto:contacto@codebears.cl">contacto@codebears.cl</a></li>
                            <li><strong>Horario:</strong> Lunes a viernes, 09:00 a 18:00 (sin hibernación)</li>
                        </ul>
                        <img src="image/oso7.png" alt="Un oso esperando tu mensaje" width="400" />
                    </section>

                    <section>
                        <h2>Tiempos de respuesta</h2>
                        <p>Somos rápidos. Más que un oso persiguiendo salmones.</p>
                        <table>
                            <thead>
                                <tr>
                                    <th>Canal</th>
                                    <th>Disponibilidad</th>
                                    <th>Tiempo de respuesta</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>Formulario web</td>
                                    <td>24/7</td>
                                    <td>Máx. 24 horas hábiles</td>
                                </tr>
                                <tr>
                                    <td>Correo electrónico</td>
                                    <td>24/7</td>
                                    <td>Máx. 24 horas hábiles</td>
                                </tr>
                                <tr>
                                    <td>Teléfono</td>
                                    <td>Lun–Vie 9–18 h</td>
                                    <td>Inmediato</td>
                                </tr>
                            </tbody>
                        </table>
                    </section>
                </main>
                <footer>
                    <p>CodeBears &copy; 2026 | Desarrollado por Vicente Fernandez</p>
                    <p><a href="contacto.html">Contacto</a></p>
                </footer>
            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);

</script>

</body>
</html>
